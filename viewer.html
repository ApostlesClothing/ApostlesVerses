<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bible Verse Viewer</title>
  <link rel="stylesheet" href="grid.css" />
  <link rel="stylesheet" href="theme.css" />

  <style>
    body {
      margin: 0;
      background: linear-gradient(to bottom right, #001F3F, #0074D9);
      color: white;
      font-family: 'Inter', sans-serif;
      text-align: center;
      padding: 2rem;
    }

    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: 1.4rem;
      background: rgba(255,255,255,0.15);
      color: white;
      padding: 8px 12px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
      z-index: 1000;
    }

    .back-button:hover {
      background: rgba(255,255,255,0.3);
    }

    #daily-photo {
      max-width: 90%;
      height: auto;
      margin-top: 3rem;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      cursor: pointer; /* Lightbox trigger */
    }

    #button-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: row-reverse;
      gap: 24px;
      z-index: 100;
    }

    #favorite-toggle,
    #share-button {
      font-size: 2rem;
      cursor: pointer;
      user-select: none;
      background: rgba(255,255,255,0.15);
      color: white;
      padding: 0.6rem 1rem;
      border-radius: 12px;
      transition: background 0.3s ease;
    }

    #favorite-toggle:hover,
    #share-button:hover {
      background: rgba(255,255,255,0.3);
    }

    #heart-effect {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 5rem;
      color: red;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity 0.4s, transform 0.4s ease-out;
    }

    #heart-effect.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.8);
    }

    #red-flash {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 0, 0, 0.2);
      z-index: 998;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease-out;
    }

    #red-flash.active {
      opacity: 1;
    }

    #favorite-message {
      position: fixed;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 1000;
      pointer-events: none;
    }

    #favorite-message.show {
      opacity: 1;
    }

    /* ✅ LIGHTBOX STYLES */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 2000;
      padding-top: 60px;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.9);
    }

    .lightbox-content {
      margin: auto;
      display: block;
      width: 90%;
      max-width: 800px;
    }

    .close {
      position: absolute;
      top: 30px;
      right: 40px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }

    .lightbox-image {
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      #button-bar {
        bottom: 16px;
        gap: 16px;
      }

      #favorite-toggle,
      #share-button {
        font-size: 1.6rem;
        padding: 0.5rem 0.8rem;
      }

      #favorite-message {
        bottom: 18%;
        font-size: 0.9rem;
      }

      .back-button {
        font-size: 1.2rem;
        padding: 6px 10px;
      }
    }
  </style>
</head>
<body>

<a href="index.html" class="back-button" style="left: 50%; transform: translateX(-50%);">← Back to Topics</a>
  <img id="daily-photo" class="verse-img" src="" alt="Verse of the Day" />

  <div id="red-flash"></div>
  <div id="heart-effect">❤️</div>
  <div id="favorite-message"></div>

  <div id="button-bar">
    <div id="favorite-toggle">🤍</div>
    <div id="share-button">📤</div>
  </div>

  <!-- ✅ LIGHTBOX HTML -->
  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img class="lightbox-image" src="" alt="Enlarged Verse" />
  </div>

  <script>
    const savedTheme = localStorage.getItem("theme") || "blue";
    document.body.classList.add(savedTheme + "-theme");

    const today = new Date();
    const start = new Date(today.getFullYear(), 0, 0);
    const diff = today - start + ((start.getTimezoneOffset() - today.getTimezoneOffset()) * 60 * 1000);
    const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
    const imageNumber = (dayOfYear % 365) + 1;

    const params = new URLSearchParams(window.location.search);
    const category = params.get("category") || params.get("category-es") || "hope";

    const dailyPhoto = document.getElementById("daily-photo");
    if (dailyPhoto) {
      dailyPhoto.src = `images/${category}/${imageNumber}.png`;
      dailyPhoto.onerror = () => {
        dailyPhoto.src = "images/fallback.png";
      };
    }

    const currentImage = { category, imageNumber };

    const favoriteToggle = document.getElementById("favorite-toggle");
    const heartEffect = document.getElementById("heart-effect");
    const redFlash = document.getElementById("red-flash");
    const shareButton = document.getElementById("share-button");
    const favoriteMessage = document.getElementById("favorite-message");

    function getStorageKey() {
      return (category.includes("á") || window.location.search.includes("category-es"))
        ? "favorites-es"
        : "favorites";
    }

    function isCurrentFavorited() {
      const favorites = JSON.parse(localStorage.getItem(getStorageKey()) || "[]");
      return favorites.some(f =>
        f.category === currentImage.category && f.imageNumber === currentImage.imageNumber
      );
    }

    function updateHeartIcon() {
      if (favoriteToggle) {
        favoriteToggle.textContent = isCurrentFavorited() ? "❤️" : "🤍";
      }
    }

    function showFavoriteMessage(text) {
      favoriteMessage.textContent = text;
      favoriteMessage.classList.add("show");
      setTimeout(() => {
        favoriteMessage.classList.remove("show");
      }, 1500);
    }

    function toggleFavorite() {
      const storageKey = getStorageKey();
      let favorites = JSON.parse(localStorage.getItem(storageKey) || "[]");

      const index = favorites.findIndex(f =>
        f.category === currentImage.category && f.imageNumber === currentImage.imageNumber
      );

      if (index >= 0) {
        favorites.splice(index, 1);
        const msg = (category === "spanish")
          ? "Esta imagen ha sido eliminada de tus favoritos"
          : "This image has been removed from your favorites";
        showFavoriteMessage(msg);
      } else {
        favorites.push(currentImage);
        const msg = (category === "spanish")
          ? "Esta imagen ha sido añadida a tus favoritos"
          : "This image has been added to your favorites";
        showFavoriteMessage(msg);

        if (heartEffect && redFlash) {
          heartEffect.classList.add("active");
          redFlash.classList.add("active");

          setTimeout(() => {
            heartEffect.classList.remove("active");
            redFlash.classList.remove("active");
          }, 600);
        }
      }

      localStorage.setItem(storageKey, JSON.stringify(favorites));
      updateHeartIcon();
    }

    if (favoriteToggle) {
      favoriteToggle.addEventListener("click", toggleFavorite);
      updateHeartIcon();
    }

    if (shareButton) {
      shareButton.addEventListener("click", async () => {
        const imageUrl = `https://apostlesclothing.github.io/ApostlesVerses/images/${category}/${imageNumber}.png`;

        if (navigator.share) {
          try {
            await navigator.share({
              title: `Verse of the Day - ${category}`,
              text: `Check out this verse from the "${category}" topic!`,
              url: imageUrl,
            });
          } catch (err) {
            console.error("Share canceled or failed:", err);
          }
        } else {
          alert("Sharing is not supported on this browser.");
        }
      });
    }

    // ✅ LIGHTBOX SCRIPT
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.querySelector(".lightbox-image");
    const closeBtn = document.querySelector(".close");

    if (dailyPhoto) {
      dailyPhoto.addEventListener("click", () => {
        lightboxImage.src = dailyPhoto.src;
        lightbox.style.display = "block";
      });
    }

    if (closeBtn) {
      closeBtn.addEventListener("click", () => {
        lightbox.style.display = "none";
      });
    }

    window.addEventListener("click", (e) => {
      if (e.target === lightbox) {
        lightbox.style.display = "none";
      }
    });
  </script>
</body>
</html>
